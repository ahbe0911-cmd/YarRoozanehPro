name: Build Insta Client APK
on:
  workflow_dispatch:
  push:
    branches: [main, insta-client-v1]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: insta-client
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Add current sing-box Android core
        run: |
          asset=$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest | \
            jq -r '.assets[] | select(.name | test("android-arm64.tar.gz$")) | .browser_download_url' | head -1)
          test -n "$asset"
          curl -fL "$asset" -o /tmp/sing-box.tar.gz
          mkdir -p app/src/main/jniLibs/arm64-v8a /tmp/sing-box
          tar -xzf /tmp/sing-box.tar.gz -C /tmp/sing-box
          binary=$(find /tmp/sing-box -type f -name sing-box | head -1)
          test -x "$binary"
          cp "$binary" app/src/main/jniLibs/arm64-v8a/libsingbox.so
      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify embedded core
        run: unzip -l app/build/outputs/apk/release/app-release.apk | grep 'lib/arm64-v8a/libsingbox.so'
      - uses: actions/upload-artifact@v4
        with:
          name: InstaClient-arm64
          path: insta-client/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
